name: Monitor Promobit

permissions:
  contents: write   # necessário pra o próprio workflow commitar data/ de volta

on:
  schedule:
    # roda a cada 5 minutos
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo GitHub também

# evita que duas execuções rodem ao mesmo tempo e briguem pra commitar o histórico
concurrency:
  group: monitor-promobit
  cancel-in-progress: false

jobs:
  checar-ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper e enviar pro Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py

      - name: Salvar histórico de ofertas já vistas
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualiza histórico de ofertas [skip ci]"
          git push